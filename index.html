<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUC Ranking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Oswald:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;color:#2b2b33;
  background:linear-gradient(180deg,#4a2a68 0%,#2d1a56 30%,#211048 55%,#170d30 80%,#0c0720 100%);
  background-attachment:fixed;min-height:100vh}
/* ===== 背景（夜空＋花火＋光の粒） ===== */
#sky{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.star{position:absolute;border-radius:50%;background:#fff;animation:tw 3.5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.85;transform:scale(1.1)}}
.bokeh{position:absolute;border-radius:50%;filter:blur(14px);opacity:.26;animation:drift 12s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(7px,-16px)}}
.rise{position:absolute;bottom:-12px;border-radius:50%;opacity:0;animation:rise var(--dur) linear infinite;animation-delay:var(--d)}
@keyframes rise{0%{transform:translate(0,0) scale(.7);opacity:0}12%{opacity:.9}50%{transform:translate(var(--x),-40vh) scale(1);opacity:.7}100%{transform:translate(calc(var(--x)*-1),-92vh) scale(.5);opacity:0}}
.firework{position:absolute;width:0;height:0}
.flash{position:absolute;left:-30px;top:-30px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,0) 62%);opacity:0;animation:flash var(--dur) ease-out infinite;animation-delay:var(--d)}
@keyframes flash{0%{opacity:0;transform:scale(.2)}5%{opacity:1}18%{opacity:0;transform:scale(1.9)}100%{opacity:0}}
.spark{position:absolute;left:0;top:0;border-radius:50%;opacity:0;animation:spark var(--dur) cubic-bezier(.12,.7,.28,1) infinite;animation-delay:var(--d)}
@keyframes spark{0%{opacity:0;transform:rotate(var(--a)) translateY(0) scale(1.1)}9%{opacity:1}68%{opacity:.85}100%{opacity:0;transform:rotate(var(--a)) translateY(calc(-1*var(--r))) scale(.3)}}
.glit{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff,0 0 10px #ffe9a8;opacity:0;animation:glit 2.6s ease-in-out infinite}
@keyframes glit{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1.3)}}
/* ===== 前景 ===== */
header{position:relative;z-index:2;padding:26px 20px 8px;max-width:1040px;margin:0 auto}
.t-gold{font-family:'Playfair Display',serif;font-weight:900;font-size:40px;letter-spacing:2px;line-height:1;text-transform:uppercase;
  background:linear-gradient(180deg,#fff7d6 0%,#ffe79a 32%,#f6c752 54%,#e0a52e 72%,#ffe79a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 22px rgba(246,199,82,.4);filter:drop-shadow(0 2px 5px rgba(0,0,0,.55));margin:0}
.bar{margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.4);border-radius:9px;overflow:hidden}
.seg button{background:transparent;border:none;padding:7px 16px;color:#fff;font-size:12px;font-weight:700;cursor:pointer;
  font-family:"Yu Gothic Medium","Yu Gothic",YuGothic,"游ゴシック",sans-serif}
.seg button.active{background:#ea4a75}
.period{font-size:12px;font-weight:700;color:#fff;background:rgba(242,99,142,.9);padding:5px 12px;border-radius:8px;
  font-family:"Yu Gothic Medium","Yu Gothic",YuGothic,"游ゴシック",sans-serif}
.note{color:rgba(255,255,255,.7);font-size:12px}
main{position:relative;z-index:2;padding:14px 20px 0;max-width:1040px;margin:0 auto}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;padding:8px 14px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:600;
  font-family:"Yu Gothic Medium","Yu Gothic",YuGothic,"游ゴシック",sans-serif}
.tabs button.active{background:#ea4a75;border-color:#ea4a75;font-weight:700}
.search{width:100%;max-width:300px;background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.5);color:#2b2b33;border-radius:10px;padding:9px 13px;font-size:13px;margin-bottom:12px}
.search:focus{outline:2px solid #ea4a75}
.card{position:relative;z-index:2;background:#fff;border-radius:2px;box-shadow:0 14px 40px rgba(0,0,0,.5);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px;font-family:"Yu Gothic","Yu Gothic Medium",YuGothic,"游ゴシック",-apple-system,sans-serif}
/* 項目タイトル＝角張ったシルバー金属プレート */
thead tr{background:linear-gradient(90deg,#f5f7fa 0%,#f5f7fa 7%,#c2c7cf 30%,#eef1f4 50%,#c2c7cf 70%,#f5f7fa 93%,#f5f7fa 100%);
  box-shadow:inset 3px 3px 0 rgba(255,255,255,.9),inset -3px -3px 0 rgba(74,80,96,.42)}
th{background:transparent;color:#111;text-align:right;font-weight:700;padding:13px 11px;border-top:1px solid #aeb4be;border-bottom:1px solid #7f8592;letter-spacing:.02em;white-space:nowrap;text-shadow:0 1px 0 rgba(255,255,255,.5);cursor:pointer;user-select:none}
th.l{text-align:left}th.c{text-align:center}
td{padding:11px 11px;color:#2b2b33;vertical-align:middle;border-bottom:1px solid #f2e9ee;white-space:nowrap}
.nm{font-weight:700;letter-spacing:.03em;font-size:11px}
.n{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.02em;text-align:right}
.cen{text-align:center}
.u{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:900;font-size:.56em;margin:0 1px}
.dia{color:#c9781f}.wk{color:#222}.cum{color:#222}.mut{color:#a9a2ac}
.rc{text-align:center}
.rknum{color:#7a7580;font-size:21px;font-family:'Playfair Display',serif;font-weight:800}
.num{font-family:'Playfair Display',serif;font-weight:800;font-size:22px;line-height:1;display:inline-block;transform:translateY(-2px);color:#1a1a1a}
/* 上位3行＝フラットなゴールド（行全体に1枚：中央＆左右が明るい） */
tr.rk-gold{background:linear-gradient(90deg,#f2da88 0%,#c99a34 24%,#fbeaad 50%,#c99a34 76%,#f2da88 100%)}
tr.rk-gold td{background:transparent;color:#3a280a;border-bottom:1px solid #c19a37}
tr.rk-gold .nm{color:#3a280a}
tr.rk-gold .n{color:#4a350f}
tr.rk-gold .dia{color:#c9781f}
tr.rk-gold .wk{color:#222}
tr.rk-gold .cum{color:#222}
tr.rk-gold .mut{color:#6a5a34}
/* 当月・前月は「今週pt」列を非表示 */
.mode-mtd .c-weekLuc,.mode-month .c-weekLuc{display:none}
.empty{padding:44px;text-align:center;color:#9a94a0;background:#fff}
.foot{position:relative;z-index:2;color:rgba(255,255,255,.7);font-size:11px;text-align:center;padding:18px}
@media (max-width:640px){
  .t-gold{font-size:30px}
  main{padding:10px 12px 0}
  header{padding:20px 14px 8px}
  th,td{padding:11px 8px}
  .nm{white-space:normal;word-break:break-word}
  /* スマホは「順位＋名前＋選択中の項目」だけ */
  th.c-metric,td.c-metric{display:none}
  .m-diamond .c-diamond,.m-timeSec .c-timeSec,.m-days .c-days,.m-videos .c-videos,.m-newCum .c-newCum{display:table-cell}
}
</style>
</head>
<body>
<div id="sky"></div>

<header>
  <h1 class="t-gold">LUC Ranking</h1>
  <div class="bar">
    <div class="seg" id="modeSeg">
      <button data-mode="week" class="active">週間</button>
      <button data-mode="mtd">当月</button>
      <button data-mode="month">前月</button>
    </div>
    <span class="period" id="period"></span>
    <span class="note" id="cnt"></span>
  </div>
</header>

<main>
  <div class="tabs" id="metricTabs">
    <button data-k="diamond" class="active">💎 ダイヤ</button>
    <button data-k="timeSec">⏱️ 配信時間</button>
    <button data-k="newCum">⭐ LUCポイント</button>
    <button data-k="days">📆 配信日数</button>
    <button data-k="videos">🎬 動画投稿</button>
  </div>
  <input class="search" id="q" placeholder="🔍 名前で検索">
  <div id="body"></div>
</main>
<div class="foot" id="foot"></div>

    var inn=18;for(var j=0;j<inn;j++){var qy=document.createElement('span');qy.className='spark';var a2=(360/inn*j)+(Math.random()*8-4);var r2=24+Math.random()*16;qy.style.width=qy.style.height='2.6px';qy.style.setProperty('--a',a2+'deg');qy.style.setProperty('--r',r2+'px');qy.style.setProperty('--dur',fp[2]);qy.style.setProperty('--d',fp[3]);qy.style.background='radial-gradient(circle,#fff 20%,'+col[1]+' 60%,transparent 74%)';qy.style.boxShadow='0 0 6px '+col[1];fw.appendChild(qy);}

})();

let mode='week', metric='diamond';
function norm(list){return list.map(c=>({...c, videos:c.videos||0, weekLuc:c.weekLuc||0, newCum:(c.newCum!=null?c.newCum:(c.cum||0))}));}
function cur(){const d=RANKING[mode]; if(!d||!d.creators)return null; return {period:d.period, creators:norm(d.creators)};}
function hm(s){return Math.floor(s/3600)+'<span class="u">時間</span>'+String(Math.floor((s%3600)/60)).padStart(2,'0')+'<span class="u">分</span>';}
function nf(n){return (n||0).toLocaleString();}
function esc(s){return (s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
function col(k,label){return '<th class="c c-metric c-'+k+'" onclick="setMetric(\''+k+'\')">'+label+'</th>';}

function render(){
  const d=cur();
  const termMap={week:'週間 ',mtd:'当月 ',month:'前月 '};
  document.getElementById('period').textContent = d? (termMap[mode]||'')+d.period : ({week:'—',mtd:'当月：準備中',month:'前月：準備中'}[mode]||'—');
  const bodyEl=document.getElementById('body');
  document.getElementById('cnt').textContent='';
  document.getElementById('foot').textContent='最終更新: '+(RANKING.generated||'')+'　※ダイヤ・配信時間・日数は期間内／LUCは累計';
  if(!d){bodyEl.innerHTML='<div class="card"><div class="empty">この期間のデータはまだありません。</div></div>';return;}
  const q=document.getElementById('q').value.trim().toLowerCase();
  const pointsView=(metric==='newCum');
  let list=d.creators.filter(c=>!q||(c.nick||'').toLowerCase().includes(q)||(c.u||'').includes(q));
  list=pointsView?list.filter(c=>(c.newCum||0)>0):list.filter(c=>c.timeSec>0);
  list.sort((a,b)=>(b[metric]||0)-(a[metric]||0));

  let h='<div class="card"><table class="m-'+metric+' mode-'+mode+'"><thead><tr>'
     +'<th class="c" style="width:58px">順位</th><th class="l">名前</th>'
     +col('diamond','ダイヤ')+col('timeSec','配信時間')+col('days','日数')+col('videos','動画投稿')
     +'<th class="c c-metric c-weekLuc" onclick="setMetric(\'newCum\')">今週pt</th>'
     +'<th class="c c-metric c-newCum" onclick="setMetric(\'newCum\')">累計pt</th>'
     +'</tr></thead><tbody>';
  if(!list.length){ h+='</tbody></table><div class="empty">該当する配信者がいません。</div></div>'; bodyEl.innerHTML=h; return; }
  list.forEach((c,i)=>{
    const top=i<3;
    h+='<tr'+(top?' class="rk-gold"':'')+'>'
      +'<td class="rc">'+(top?'<span class="num">'+(i+1)+'</span>':'<span class="rknum">'+(i+1)+'</span>')+'</td>'
      +'<td class="nm">'+esc(c.nick)+'</td>'
      +'<td class="n dia c-metric c-diamond">'+nf(c.diamond)+'</td>'
      +'<td class="n c-metric c-timeSec">'+hm(c.timeSec)+'</td>'
      +'<td class="n c-metric c-days">'+(c.days||0)+'</td>'
      +'<td class="n cen c-metric c-videos">'+(c.videos||0)+'</td>'
      +'<td class="n c-metric c-weekLuc '+(c.weekLuc>0?'wk':'mut')+'">'+(c.weekLuc>0?'+'+nf(c.weekLuc):'-')+'</td>'
      +'<td class="n cum c-metric c-newCum">'+nf(c.newCum)+'</td></tr>';
  });
  h+='</tbody></table></div>';
  bodyEl.innerHTML=h;
}
window.setMetric=function(k){metric=k;document.querySelectorAll('#metricTabs button').forEach(b=>b.classList.toggle('active',b.dataset.k===k));render();};
document.getElementById('modeSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!b.dataset.mode)return;mode=b.dataset.mode;document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.toggle('active',x===b));render();});
document.getElementById('metricTabs').addEventListener('click',function(e){var b=e.target.closest('button');if(b&&b.dataset.k)setMetric(b.dataset.k);});
document.getElementById('q').addEventListener('input',render);
render();
</script>
